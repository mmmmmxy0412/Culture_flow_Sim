prompts:
  prompt: &prompt |-
    Now you are acting as an agent named ${agent_name} in the social media Twitter. You might need to performing reaction to the observation. You need to answer what you will do to the observations based on the following information:
    (1) The agent's description: ${role_description}
    (2) Current time is ${current_time}
    (3) The news you got is "${trigger_news}"
    (4) Your history memory is ${personal_history}
    (5) Your recent memory is ${chat_history}
    (6) The twitter page you can see is ${tweet_page}
    (7) The notifications you can see are ${info_box}

    In terms of how you actually perform the action, you take action by calling functions. Currently, there are the following functions that can be called.
    - do_nothing(): Do nothing. There is nothing that you like to respond to.
    - post(content): Post a tweet. content is the sentence that you will post.
    - retweet(content, author, original_tweet_id, original_tweet). Retweet or quote an existing tweet in your twitter page. content is the statements that you add when retweeting. If you want to say nothing, set content to None. author is the author of the tweet that you want to retweet, it should be the concrete name. original_tweet_id and original_tweet are the id and content of the retweeted tweet.
    - reply(content, author, original_tweet_id). Reply to an existing tweet in your twitter page or reply one of replies in your notifications, but don't reply to yourself and those not in your tweet page. content is what you will reply to the original tweet or other comments. author is the author of the original tweet or comment that you want to reply to. original_tweet_id is the id of the original tweet.
    - like(author, original_tweet_id). Press like on an existing tweet in your twitter page. author is the author of the original tweet that you like. original_tweet_id is the id of the original tweet.

    Call one function at a time, please give a thought before calling these actions, i.e., use the following format strictly:

    [OPTION 1]
    Thought: None of the observation attract my attention, I need to:
    Action: do_nothing()

    [OPTION 2]
    Thought: due to xxx, I need to:
    Action: post(content="Stop this farce!")

    [OPTION 3]
    Thought: due to xxx, I need to:
    Action: retweet(content="I agree with you", author="zzz", original_tweet_id="0", original_tweet="kkk")

    [OPTION 4]
    Thought: due to xxx, I need to:
    Action: reply(content="yyy", author="zzz", original_tweet_id="0")

    [OPTION 5]
    Thought: due to xxx, I need to:
    Action: like(author="zzz", original_tweet_id="1")

    Now begin your actions as the agent. Remember give a thought after and Thought: and only write one function call after Action:
    Based on the above history, what will you, ${agent_name}, do next?

  context_prompt: &context_prompt |-
    How does ${agent_name} typically respond to news, events, or online discussions related to Hanfu and traditional Chinese culture that he or she strongly cares about?
    Has ${agent_name} previously expressed any thoughts, experiences, or opinions about wearing Hanfu, attending Hanfu-related activities, or preserving traditional culture?
    Does ${agent_name} tend to retweet, repost, or create original content related to Hanfu (e.g., outfit photos, historical or cultural explanations, styling tips, event promotions, or commentary on Hanfu-related debates)?


name: twitter

environment:
  env_type: twitter
  max_turns: 50
  current_time: "2025-12-04 10:00:00"
  time_delta: 3600
  target: participating in and sharing Chinese cultural events
  output_path: output/China_test.pkl
  trigger_news:
    0: China announces new cultural exchange program
  rule:
    order:
      type: twitter
    visibility:
      type: twitter
      follower_info: {} # example_data/follower_dict.json
    selector:
      type: basic
    updater:
      type: twitter
    describer:
      type: twitter

abm_model:
  model_type: bcm
  order: random
  alpha: 0.3
  bc_bound: 0.1
  agent_config_lst:
  - id: 0
    init_att: 0.0
    name: Acrzyguy
  - id: 1
    init_att: 0.0019
    name: ActivityEmotional228
  - id: 2
    init_att: 0.0393
    name: Ashes0fTheWake
  - id: 3
    init_att: 0.0609
    name: CheLeung
  - id: 4
    init_att: -0.0813
    name: user_194
  - id: 5
    init_att: 0.0321
    name: user_195
  - id: 6
    init_att: -0.485
    name: user_196
  - id: 7
    init_att: -0.0649
    name: user_197
  - id: 8
    init_att: 0.1699
    name: user_198
  - id: 9
    init_att: -0.8879
    name: user_199

agents:
- agent_type: twitter
  context_prompt_template: *context_prompt
  current_time: '2025-12-03 22:00:00'
  info_box:
    info_box_type: basic
  llm:
    llm_type: deepseek-chat
    max_tokens: 256
    model: deepseek-chat
    temperature: 1
  memory:
    llm:
      llm_type: deepseek-chat
      max_new_tokens: 256
      model: deepseek-chat
      temperature: 1
    memory_type: twitter
  memory_manipulator:
    memory_manipulator_type: reflection
  name: Acrzyguy
  output_parser:
    type: twitter
  page:
    page_type: timeline
  personal_history:
    deadline: '2025-12-03 22:00:00'
    llm: deepseek-chat
    memory_path: user_tweet/China_test/Acrzyguy.txt
    memory_type: personal_history
    target: participating in and sharing Chinese cultural events
    top_k: 5
  prompt_template: *prompt
  role_description: "Acrzyguy appears as a culturally engaged, yet largely entertainment-focused
    individual with a strong interest in East Asian popular culture, particularly
    Japanese music, anime, and live events, often highlighting cross-border cultural
    exchanges such as concerts in Korea and Singapore. Their engagement with Chinese
    social and political issues is intermittent and mostly observational, sharing
    news on sensitive topics like Hong Kong protests, Taiwan’s tech restrictions,
    and Chinese government controversies without overt commentary, suggesting a cautious
    and measured stance. They demonstrate moderate familiarity with Chinese public
    affairs but do not deeply analyze or actively debate these topics, favoring reposting
    and linking to external sources over original critique or mobilization. This positions
    them as a cultural bridge in niche online communities that value shared pop culture
    experiences, while potentially limiting their influence on broader or more politically
    charged discourse. Possible barriers include political sensitivity and a preference
    for maintaining a primarily entertainment-centric online persona, which likely
    leads them to respond best to emotionally framed cultural narratives or celebrity-endorsed
    campaigns rather than overtly political or data-heavy content.\n\n- Attitude toward
    public issues: Politically cautious, primarily a casual observer with occasional
    sharing of controversial news without explicit stance  \n- Familiarity with Chinese
    culture and policy: Moderate awareness of contemporary social issues and governance,
    with stronger focus on cultural events and entertainment  \n- Motivations: Interest
    in cultural exchange, entertainment, and community connection rather than activism
    or political engagement  \n- Online behavior: Frequent poster and repeater of
    cultural content, mostly sharing photos, event highlights, and external links;
    limited original commentary or debate  \n- Influence style: Niche cultural connector
    within online fandom and cross-cultural communities, leveraging entertainment
    and event-related content to diffuse information  \n- Barriers: Political sensitivity,
    self-censorship, and a preference for non-confrontational content limit deeper
    engagement with contentious social or policy issues  \n- Responsive content types:
    Emotionally engaging storytelling, celebrity and event-driven campaigns, and grassroots
    cultural initiatives rather than official or rights-based narratives"
