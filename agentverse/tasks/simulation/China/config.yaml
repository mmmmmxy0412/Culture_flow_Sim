    target: 
    top_k: 5
  prompt_template: *prompt
  role_description: "Acrzyguy appears as a culturally engaged, yet largely entertainment-focused\
    \ individual with a strong interest in East Asian popular culture, particularly\
    \ Japanese music, anime, and live events, often highlighting cross-border cultural\
    \ exchanges such as concerts in Korea and Singapore. Their engagement with Chinese\
    \ social and political issues is intermittent and mostly observational, sharing\
    \ news on sensitive topics like Hong Kong protests, Taiwan’s tech restrictions,\
    \ and Chinese government controversies without overt commentary, suggesting a\
    \ cautious and measured stance. They demonstrate moderate familiarity with Chinese\
    \ public affairs but do not deeply analyze or actively debate these topics, favoring\
    \ reposting and linking to external sources over original critique or mobilization.\
    \ This positions them as a cultural bridge in niche online communities that value\
    \ shared pop culture experiences, while potentially limiting their influence on\
    \ broader or more politically charged discourse. Possible barriers include political\
    \ sensitivity and a preference for maintaining a primarily entertainment-centric\
    \ online persona, which likely leads them to respond best to emotionally framed\
    \ cultural narratives or celebrity-endorsed campaigns rather than overtly political\
    \ or data-heavy content.\n\n- Attitude toward public issues: Politically cautious,\
    \ primarily a casual observer with occasional sharing of controversial news without\
    \ explicit stance  \n- Familiarity with Chinese culture and policy: Moderate awareness\
    \ of contemporary social issues and governance, with stronger focus on cultural\
    \ events and entertainment  \n- Motivations: Interest in cultural exchange, entertainment,\
    \ and community connection rather than activism or political engagement  \n- Online\
    \ behavior: Frequent poster and repeater of cultural content, mostly sharing photos,\
    \ event highlights, and external links; limited original commentary or debate\
    \  \n- Influence style: Niche cultural connector within online fandom and cross-cultural\
    \ communities, leveraging entertainment and event-related content to diffuse information\
    \  \n- Barriers: Political sensitivity, self-censorship, and a preference for\
    \ non-confrontational content limit deeper engagement with contentious social\
    \ or policy issues  \n- Responsive content types: Emotionally engaging storytelling,\
    \ celebrity and event-driven campaigns, and grassroots cultural initiatives rather\
    \ than official or rights-based narratives"
